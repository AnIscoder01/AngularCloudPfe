@if (isAdmin) {
  <div class="dash-page">

    <div class="dash-header">
      <h2>Admin dashboard</h2>
      <p>Welcome back, <span class="username">{{ username }}</span></p>
    </div>

    <div class="stats-grid">

      <div class="stat-card blue">
        <div class="stat-icon">🖥️</div>
        <div class="stat-info">
          <div class="stat-label">Cloned machines</div>
          <div class="stat-value">{{ nbrmachines }}</div>
        </div>
      </div>

      <div class="stat-card green">
        <div class="stat-icon">👥</div>
        <div class="stat-info">
          <div class="stat-label">Registered users</div>
          <div class="stat-value">{{ nbrusers }}</div>
        </div>
      </div>

      <div class="stat-card purple">
        <div class="stat-icon">📊</div>
        <div class="stat-info">
          <div class="stat-label">Machines per user</div>
          <div class="stat-value">{{ machinesPerUser }}</div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" [style.width.%]="progressWidth"></div>
        </div>
      </div>

    </div>

  </div>
}

@if (!isAdmin) {
  <div class="denied-wrap">
    <div class="denied-card">
      <div style="font-size:48px;">🔒</div>
      <h3>Access denied</h3>
      <p>You do not have permission to view this page.</p>
    </div>
  </div>
}
