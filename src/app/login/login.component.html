<div class="container d-flex">
</div>
<form class="login">
  <h2>Welcome, to CloudApp!</h2>
  <p>Please log in</p>
  <input  name="username" type="text" placeholder="Username" [(ngModel)]="username">
  <input name="password" type="password" placeholder="Password" [(ngModel)]="password">
  <button  type="submit"  class="btn btn-primary" (click)="verifyLogin()" >login </button>
  <div class="links">
    <a href="#">Forgot password</a>
  </div>
</form>
